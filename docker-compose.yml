services:
  dragonwilds:
    image: chloesapage/dragonwilds-server:latest
    container_name: dragonwilds
    environment:
      - DEFAULT_WORLD_NAME=MyWorld
      - OWNER_ID=your_owner_id
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}/udp"
    env_file:
      - .env
    volumes:
    - ./server-data:/home/ubuntu/Steam
    restart: unless-stopped